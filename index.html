<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Cadastro de Endereço</title>
    </head>
    <body>

        <main class="container">
            <h2>Cadastro de Endereço</h2>
            
            <form id="form-endereco">
                <!-- Nome Completo -->
                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <!-- CEP -->
                <div>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                </div>

                <!-- Rua, Número e Complemento -->
                <div>
                    <label for="rua">Rua / Logradouro:</label>
                    <input type="text" id="rua" name="rua" placeholder="Nome da rua" required>
                </div>

                <div>
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero" placeholder="Nº" required>
                </div>

                <div>
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, Casa (Opcional)">
                </div>

                <!-- Bairro, Cidade e Estado -->
                <div>
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" placeholder="Digite o bairro" required>
                </div>

                <div>
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade" required>
                </div>

                <div>
                    <label for="estado">Estado (UF):</label>
                    <input type="text" id="estado" name="estado" placeholder="UF" maxlength="2" required>
                </div>

                <!-- Botão de Envio -->
                <button type="submit">Cadastrar</button>
            </form>
        </main>
        <script src="script.js"></script>
    </body>
</html>
